name: Build 9 Ball Scorekeeper AAB

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unzip V5 source
        run: unzip -q 9BallScorekeeper_V5_Practice_Source.zip

      - name: Configure AndroidX
        working-directory: 9BallScorekeeper_V4_League
        run: echo "android.useAndroidX=true" > gradle.properties

      - name: Recover original Play upload key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build-aab.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.run_number == 5 and .conclusion == "success") | .id' \
            | head -n 1)

          if [ -z "$RUN_ID" ]; then
            echo "Could not find successful original Build #5."
            exit 1
          fi

          mkdir -p old-signing-artifact

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "9BallScorekeeper-AAB" \
            --dir old-signing-artifact

          KEYSTORE=$(find old-signing-artifact -type f -name "*.jks" | head -n 1)
          PASSFILE=$(find old-signing-artifact -type f -name "upload-keystore-password.txt" | head -n 1)

          if [ -z "$KEYSTORE" ] || [ -z "$PASSFILE" ]; then
            echo "Original signing key or password was not found."
            exit 1
          fi

          cp "$KEYSTORE" 9BallScorekeeper_V4_League/app/upload-keystore.jks

          PASS=$(tr -d '\r\n' < "$PASSFILE")
          echo "::add-mask::$PASS"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Configure release signing
        working-directory: 9BallScorekeeper_V4_League
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("upload-keystore.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = "upload"
                      keyPassword = System.getenv("KEYSTORE_PASSWORD")
                  }
              }

              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF

      - name: Build V5 AAB
        working-directory: 9BallScorekeeper_V4_League
        run: gradle bundleRelease

      - name: Prepare AAB
        run: |
          cp \
            9BallScorekeeper_V4_League/app/build/outputs/bundle/release/app-release.aab \
            9BallScorekeeper-V5.aab

      - name: Upload V5 AAB
        uses: actions/upload-artifact@v4
        with:
          name: 9BallScorekeeper-V5-AAB
          path: 9BallScorekeeper-V5.aab
