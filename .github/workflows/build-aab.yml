
name: Build 9 Ball Scorekeeper AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unzip V5 source
        run: unzip -q 9BallScorekeeper_V5_2_Practice_Source.zip

      - name: Change app name
        working-directory: 9BallScorekeeper_V4_League
        run: sed -i 's/android:label="[^"]*"/android:label="9Ball Scorekeeper - League Practice"/' app/src/main/AndroidManifest.xml

      - name: Set custom app icon
        working-directory: 9BallScorekeeper_V4_League
        run: |
            mkdir -p app/src/main/res/drawable
            cp ../file_000000005f1481f5a4a0012b4c5bdadf.png app/src/main/res/drawable/app_icon.png
            sed -i 's|android:icon="[^"]*"|android:icon="@drawable/app_icon"|g' app/src/main/AndroidManifest.xml
            sed -i 's|android:roundIcon="[^"]*"|android:roundIcon="@drawable/app_icon"|g' app/src/main/AndroidManifest.xml

      - name: Configure AndroidX
        working-directory: 9BallScorekeeper_V4_League
        run: echo "android.useAndroidX=true" > gradle.properties
      - name: Set version code 5.2
        working-directory: 9BallScorekeeper_V4_League
        run: sed -i 's/versionCode = 51/versionCode = 55/' app/build.gradle.kts
      - name: Restore original upload key
        working-directory: 9BallScorekeeper_V4_League
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTOREBASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks

      - name: Configure release signing
        working-directory: 9BallScorekeeper_V4_League
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTOREPASSWORD }}
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("upload-keystore.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = "upload"
                      keyPassword = System.getenv("KEYSTORE_PASSWORD")
                  }
              }

              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF

      - name: Build V5 Practice AAB
        working-directory: 9BallScorekeeper_V4_League
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTOREPASSWORD }}
        run: gradle bundleRelease

      - name: Copy V5 AAB
        run: |
          cp 9BallScorekeeper_V4_League/app/build/outputs/bundle/release/app-release.aab \
             9BallScorekeeper-V5-Practice.aab

      - name: Upload V5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: 9BallScorekeeper-V5-Practice-AAB
          path: 9BallScorekeeper-V5-Practice.aab
